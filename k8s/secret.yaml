apiVersion: v1
kind: Secret
metadata:
  name: petshop-secrets
  namespace: petshop
  labels:
    app.kubernetes.io/part-of: petshop
type: Opaque
stringData:
  POSTGRES_USER: petshop
  POSTGRES_PASSWORD: change-me-db-password
  JWT_SECRET: change-me-to-a-random-string-of-at-least-64-characters-0123456789abcdefghij
  ADMIN_EMAIL: admin@petshop.az
  ADMIN_PASSWORD: change-me-admin-password
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_FROM: ""
  MAIL_NOTIFY_TO: ""
  GOOGLE_CLIENT_ID: ""

