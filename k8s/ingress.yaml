apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petshop-backend
  namespace: petshop
  labels:
    app.kubernetes.io/part-of: petshop
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
spec:
  ingressClassName: nginx
  rules:
    - host: api.petshop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: petshop-backend
                port:
                  name: http

